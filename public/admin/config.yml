  - name: branches
    label: 📍 الفروع والخريطة
    file: src/content/branches.json
    format: json
    fields:
    - label: الفروع / المقرات
      name: branches
      widget: list
      fields:
      - label: المدينة
        name: city
        widget: string
      - label: اسم الفرع
        name: name
        widget: string
      - label: العنوان
        name: address
        widget: string
      - label: الهاتف
        name: phone
        widget: string
        required: false
      - label: البريد الإلكتروني
        name: email
        widget: string
        required: false
      - label: خط العرض (Latitude)
        name: lat
        widget: number
        value_type: float
        min: -90
        max: 90
        step: 0.0001
      - label: خط الطول (Longitude)
        name: lng
        widget: number
        value_type: float
        min: -180
        max: 180
        step: 0.0001
      - label: رابط Google Maps
        name: google_map_link
        widget: string
        required: false
      required: false
      summary: '{{fields.name}} — {{fields.city}}'
  description: الشعار، الهاتف، البريد، روابط فيسبوك وإنستغرام، والفروع.
